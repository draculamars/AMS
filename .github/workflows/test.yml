name: Tests
on: [push, pull_request]
jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.lock -r requirements-dev.txt
      - run: python -m pytest -q
        env:
          ASSET_WATCH_ENABLED: '0'
      - run: python scripts/package-release.py release.zip
      - uses: actions/upload-artifact@v4
        with:
          name: ams-${{ matrix.os }}
          path: release.zip
